# component: a purl with @version, or without it for every version.

- id: GO-2026-5932
  component: pkg:golang/golang.org/x/crypto@v0.58.0
  status: not_affected
  justification: vulnerable_code_not_present
  impact: No golang.org/x/crypto/openpgp package is built into cra (go list -deps ./cmd/...); the openpgp code a dependency uses is github.com/ProtonMail/go-crypto, the maintained replacement.
  date: "2026-11-06"
- id: GO-2026-6905
  component: pkg:golang/github.com/blakesmith/ar@v0.0.0-20190502131153-809d4375e1fb
