# A release of shipward: push a tag vX.Y.Z (semantic version). This builds shipward for Linux, macOS and Windows, makes the SBOM
# of shipward itself (with shipward), writes SHA256SUMS and signs it with cosign, keyless: the signature is tied to this
# workflow on this tag through GitHub's OIDC token, and is recorded in Sigstore's public transparency log (Rekor),
# which names this repository, the workflow and the tag. Verify:
#
#   cosign verify-blob SHA256SUMS --bundle SHA256SUMS.sigstore.json \
#     --certificate-identity "https://github.com/getshipward/shipward/.github/workflows/release.yml@refs/tags/vX.Y.Z" \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
#   sha256sum -c SHA256SUMS --ignore-missing
#
# Actions are pinned to commit SHAs on purpose.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write # create the release
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Check the tag
        run: |
          [[ $GITHUB_REF_NAME =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "tag $GITHUB_REF_NAME is not vX.Y.Z"; exit 1; }

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os=${target%/*} arch=${target#*/} ext=""
            [ "$os" = windows ] && ext=.exe
            GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X main.version=$GITHUB_REF_NAME" \
              -o "dist/shipward_${GITHUB_REF_NAME#v}_${os}_${arch}${ext}" ./cmd/shipward
          done
          ls -l dist

      - name: SBOM of shipward
        run: |
          go build -o "$RUNNER_TEMP/shipward" ./cmd/shipward
          "$RUNNER_TEMP/shipward" sbom --version "${GITHUB_REF_NAME#v}" -o "dist/shipward_${GITHUB_REF_NAME#v}.cdx.json"
          "$RUNNER_TEMP/shipward" check sbom "dist/shipward_${GITHUB_REF_NAME#v}.cdx.json" --summary "$GITHUB_STEP_SUMMARY" || true

      - name: Checksums and signature
        working-directory: dist
        run: |
          sha256sum -- * > SHA256SUMS
          cosign sign-blob --yes --bundle SHA256SUMS.sigstore.json SHA256SUMS

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --title "shipward $GITHUB_REF_NAME" --verify-tag \
            --notes "Signed checksums: SHA256SUMS and SHA256SUMS.sigstore.json (verify with cosign, see .github/workflows/release.yml). SBOM: shipward_${GITHUB_REF_NAME#v}.cdx.json."
